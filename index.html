<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Copa Bravex</title>

  <!-- Preconexión a los servidores de Google para acelerar la carga en 500-800ms -->
  <link rel="preconnect" href="https://script.google.com" crossorigin />
  <link rel="preconnect" href="https://script.googleusercontent.com" crossorigin />
  <link rel="dns-prefetch" href="https://script.google.com" />
  <link rel="dns-prefetch" href="https://script.googleusercontent.com" />

  <!-- Icono real para "Añadir a pantalla de inicio" en iOS -->
  <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/jgoyeneche1/bravex_assets/main/apple-touch-icon.png" />

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Bravex" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#064e3b" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; width: 100%; overflow: hidden; background: #064e3b; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    /* El iframe ocupa toda la pantalla desde el milisegundo cero */
    #appFrame {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      z-index: 10;
      background: #064e3b;
    }

    /* Pantalla de espera ligera mientras Google Apps Script compila la página */
    #loaderInicial {
      position: fixed;
      inset: 0;
      z-index: 20;
      background: #064e3b;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      transition: opacity 0.35s ease, visibility 0.35s ease;
    }
    #loaderInicial.oculto {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .spinner {
      width: 38px;
      height: 38px;
      border: 3.5px solid rgba(255, 255, 255, 0.2);
      border-top-color: #a3e635;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 14px;
    }

    .titulo-carga {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #fff;
    }

    .sub-carga {
      font-size: 11px;
      color: #a3e635;
      margin-top: 4px;
      font-weight: 600;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <!-- Indicador visual mínimo de carga (desaparece solo en cuanto la app responde) -->
  <div id="loaderInicial">
    <div class="spinner"></div>
    <div class="titulo-carga">COPA BRAVEX</div>
    <div class="sub-carga">Entrando al Menú...</div>
  </div>

  <!-- El iframe se conecta de inmediato en paralelo -->
  <iframe id="appFrame" allow="clipboard-write; web-share; camera"></iframe>

  <script>
    var LS_SESION_ = 'bravex_sesion';
    var LS_DEVICE_ = 'bravex_device_id';

    function leerSesionGuardada_() {
      try { return JSON.parse(localStorage.getItem(LS_SESION_) || 'null'); }
      catch (e) { return null; }
    }

    function obtenerDeviceId_() {
      try {
        var id = localStorage.getItem(LS_DEVICE_);
        if (!id) {
          id = (window.crypto && crypto.randomUUID) ? crypto.randomUUID()
            : ('dev-' + Date.now() + '-' + Math.random().toString(36).slice(2));
          localStorage.setItem(LS_DEVICE_, id);
        }
        return id;
      } catch (e) {
        return null;
      }
    }

    // Escuchar mensajes desde el iframe para guardar o borrar credenciales
    window.addEventListener('message', function (ev) {
      var d = ev.data;
      if (!d || typeof d !== 'object') return;
      if (d.tipo === 'bravex_guardar_sesion' && d.nombre && d.pin) {
        try { localStorage.setItem(LS_SESION_, JSON.stringify({ nombre: d.nombre, pin: d.pin })); } catch (e) {}
      } else if (d.tipo === 'bravex_borrar_sesion') {
        try { localStorage.removeItem(LS_SESION_); } catch (e) {}
      }
    });

    // Ocultar pantalla de carga una vez cargado el iframe
    var frame = document.getElementById('appFrame');
    frame.addEventListener('load', function () {
      var loader = document.getElementById('loaderInicial');
      if (loader) loader.classList.add('oculto');
    });

    // Timeout de seguridad: si el evento load se retrasa por la red, ocultar a los 3s
    setTimeout(function() {
      var loader = document.getElementById('loaderInicial');
      if (loader) loader.classList.add('oculto');
    }, 3000);

    // INICIAR INMEDIATAMENTE: la app empieza a descargar sin esperar clics del usuario
    (function iniciarAppInmediatamente() {
      // Endpoint de producción de Google Apps Script
      var baseUrl = "https://script.google.com/macros/s/AKfycbzgTnFlxzrhvIwxH-_b4EOvdH42-0n2cOnv5mRxMiUtVZwlFt4N_8GPPtyRTRLyCU9j/exec";
      
      // Versión fija con timestamp horario para permitir aprovechamiento de caché HTTP
      var vTag = "154_" + Math.floor(Date.now() / 3600000);
      var url = baseUrl + "?inicio=1&_v=" + vTag;

      var sesion = leerSesionGuardada_();
      if (sesion && sesion.nombre && sesion.pin) {
        url += "&u=" + encodeURIComponent(sesion.nombre) + "&p=" + encodeURIComponent(sesion.pin);
      }
      var deviceId = obtenerDeviceId_();
      if (deviceId) {
        url += "&d=" + encodeURIComponent(deviceId);
      }

      frame.src = url;
    })();
  </script>
</body>
</html>
