<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Copa Bravex (V2)</title>

  <!-- Preconexión a los servidores de Google para acelerar la carga en 500-800ms -->
  <link rel="preconnect" href="https://script.google.com" crossorigin />
  <link rel="preconnect" href="https://script.googleusercontent.com" crossorigin />
  <link rel="dns-prefetch" href="https://script.google.com" />
  <link rel="dns-prefetch" href="https://script.googleusercontent.com" />

  <!-- Icono real para "Añadir a pantalla de inicio" en iOS -->
  <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/jgoyeneche1/bravex_assets/main/apple-touch-icon.png" />

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Bravex V2" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#05140e" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      position: fixed;
      inset: 0;
      height: 100%;
      height: 100dvh;
      width: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

        /* Fondo Fairway con franjas diagonales de césped */
    html, body {
      position: fixed;
      inset: 0;
      height: 100%;
      height: 100dvh;
      width: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #05150f;
      background-image:
        radial-gradient(ellipse at 50% 15%, rgba(15, 49, 37, 0.3) 0%, rgba(2, 8, 6, 0.6) 100%),
        repeating-linear-gradient(
          115deg,
          #0f3125 0px,
          #0f3125 22px,
          #05150f 22px,
          #05150f 44px
        );
      background-attachment: fixed;
      background-repeat: repeat;
      background-size: cover, auto;
    }

    #appFrame {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      border: none;
      z-index: 10;
      background-color: #05150f;
      background-image:
        radial-gradient(ellipse at 50% 15%, rgba(15, 49, 37, 0.3) 0%, rgba(2, 8, 6, 0.6) 100%),
        repeating-linear-gradient(
          115deg,
          #0f3125 0px,
          #0f3125 22px,
          #05150f 22px,
          #05150f 44px
        );
      background-attachment: fixed;
      background-repeat: repeat;
      background-size: cover, auto;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
    #appFrame.activo {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }
  </style>
</head>
<body>
  <!-- Pantalla de inicio con la imagen de la bola, escudo del grupo, frase y botón -->
  <div id="bienvenida">
    <div class="frase">“La competitividad característica fundamental de cualquier Bravo y jamás deberá anteponerse al disfrute, buen ambiente y buen humor de la partida.”</div>

    <div class="bienvenida-wrap">
      <div class="badge-v2">V2 · Prueba</div>
      <div class="sub">Bienvenido a la Bravex Cup</div>
      <button class="boton" id="btnIniciar">Iniciar</button>
    </div>
  </div>

  <!-- Iframe conectado en paralelo desde el milisegundo cero -->
  <iframe id="appFrame" allow="clipboard-write; web-share; camera"></iframe>

  <script>
    var LS_SESION_ = "bravex_sesion";
    var LS_DEVICE_ = "bravex_device_id";

    function leerSesionGuardada_() {
      try { return JSON.parse(localStorage.getItem(LS_SESION_) || "null"); } catch (e) { return null; }
    }

    function obtenerDeviceId_() {
      try {
        var id = localStorage.getItem(LS_DEVICE_);
        if (!id) {
          id = (window.crypto && crypto.randomUUID) ? crypto.randomUUID()
            : ("dev-" + Date.now() + "-" + Math.random().toString(36).slice(2));
          localStorage.setItem(LS_DEVICE_, id);
        }
        return id;
      } catch (e) {
        return null;
      }
    }

    if ('scrollRestoration' in history) {
      history.scrollRestoration = 'manual';
    }

    // Escuchar mensajes desde el iframe para guardar o borrar credenciales
    window.addEventListener("message", function (ev) {
      var d = ev.data;
      if (!d || typeof d !== "object") return;
      if (d.tipo === "bravex_guardar_sesion" && d.nombre && d.pin) {
        try { localStorage.setItem(LS_SESION_, JSON.stringify({ nombre: d.nombre, pin: d.pin })); } catch (e) {}
      } else if (d.tipo === "bravex_borrar_sesion") {
        try { localStorage.removeItem(LS_SESION_); } catch (e) {}
      }
    });

    var frame = document.getElementById("appFrame");
    var bienvenida = document.getElementById("bienvenida");
    var btnIniciar = document.getElementById("btnIniciar");
    var iframeListo = false;
    var usuarioHizoClic = false;

    // Evitar que arrastres o gestos táctiles en la bienvenida desplacen la ventana
    document.addEventListener("touchmove", function (e) {
      if (bienvenida && !bienvenida.classList.contains("oculto")) {
        e.preventDefault();
      }
    }, { passive: false });

    function resetearScrollWrapper_() {
      window.scrollTo(0, 0);
      if (document.body) document.body.scrollTop = 0;
      if (document.documentElement) document.documentElement.scrollTop = 0;
    }

    function mostrarApp() {
      resetearScrollWrapper_();
      frame.classList.add("activo");
      bienvenida.classList.add("oculto");
      try {
        if (frame.contentWindow) {
          frame.contentWindow.postMessage({ tipo: "bravex_reset_scroll" }, "*");
        }
      } catch (e) {}
      setTimeout(function () {
        resetearScrollWrapper_();
        try { if (frame.contentWindow) frame.contentWindow.postMessage({ tipo: "bravex_reset_scroll" }, "*"); } catch (e) {}
      }, 50);
      setTimeout(function () {
        resetearScrollWrapper_();
        try { if (frame.contentWindow) frame.contentWindow.postMessage({ tipo: "bravex_reset_scroll" }, "*"); } catch (e) {}
      }, 150);
    }

    // Cuando el iframe termina de compilar y descargar en segundo plano
    frame.addEventListener("load", function () {
      iframeListo = true;
      if (usuarioHizoClic) {
        mostrarApp();
      }
    });

    // Al pulsar Iniciar: entra de inmediato a la app mostrando las franjas de fondo
    btnIniciar.addEventListener("click", function () {
      usuarioHizoClic = true;
      resetearScrollWrapper_();
      mostrarApp();
    });

    // 🚀 PRECARGA EN SEGUNDO PLANO INMEDIATA:
    // Mientras el usuario contempla la pantalla de bienvenida con la bola y el escudo,
    // el iframe ya conecta y compila Google Apps Script por detrás sin hacerle esperar.
    (function precargarAppEnSegundoPlano() {
      var baseUrl = "https://script.google.com/macros/s/AKfycbzgTnFlxzrhvIwxH-_b4EOvdH42-0n2cOnv5mRxMiUtVZwlFt4N_8GPPtyRTRLyCU9j/exec";
      var vTag = "188_" + Math.floor(Date.now() / 3600000);
      var url = baseUrl + "?inicio=1&_v=" + vTag;

      var sesion = leerSesionGuardada_();
      if (sesion && sesion.nombre && sesion.pin) {
        url += "&u=" + encodeURIComponent(sesion.nombre) + "&p=" + encodeURIComponent(sesion.pin);
      }
      var deviceId = obtenerDeviceId_();
      if (deviceId) {
        url += "&d=" + encodeURIComponent(deviceId);
      }

      frame.src = url;
    })();
  </script>
</body>
</html>
